[package]
name = "string_frequency_analyzer"
version = "0.2.0"
edition = "2021"
description = "A modern text analysis tool with a Rust GUI and Python backend"
authors = ["Hoss Delgado V"]
license = "MIT"
repository = "https://github.com/HossDelgadoV/Python_String_Frequency_Engine"
readme = "README.md"

[dependencies]
# GUI Framework
iced = { version = "0.9", features = ["tokio", "image"] }

# Async Runtime
tokio = { version = "1.32.0", features = ["full"] }

# HTTP Client for API communication
reqwest = { version = "0.11", features = ["json"] }

# Serialization/Deserialization
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"

# File system operations
dirs = "5.0.1"

# Logging
log = "0.4.20"
env_logger = "0.10.0"

# Error handling
thiserror = "1.0.48"
anyhow = "1.0.75"

# Windows API
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

# File dialog
rfd = "0.15.3"

# Base64 encoding/decoding for images
base64 = "0.21.5"
